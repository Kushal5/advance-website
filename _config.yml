# Advance Software — Jekyll configuration (built automatically by GitHub Pages)
#
# NOTE on URLs: `url` and `baseurl` are intentionally NOT set here. When GitHub
# Pages builds the site, the github-pages gem fills them in automatically from
# the repository (e.g. url: https://<user>.github.io, baseurl: /<repo>).
# If you later move to a custom domain, set them explicitly:
#   url: "https://www.example.com"
#   baseurl: ""

title: Advance Software
tagline: Software engineering, data & AI. Done the right way.
description: >-
  Software engineering, data and AI systems — plus Microsoft Dynamics 365
  Business Central development — for businesses in Fiji, the Pacific,
  Australia and beyond. Built to global standards. No hype. Just what works.
lang: en
timezone: Pacific/Fiji

# Used by jekyll-seo-tag for structured data on posts/pages
author:
  name: Advance Software
logo: /assets/og-image.jpg
social:
  name: Advance Software

# All three plugins are on the GitHub Pages whitelist — no Gemfile needed.
plugins:
  - jekyll-seo-tag   # <title>, canonical, Open Graph, Twitter cards, JSON-LD
  - jekyll-sitemap   # /sitemap.xml
  - jekyll-feed      # /feed.xml (RSS/Atom for posts)

# Case studies: drop a file in _case_studies/ (any name).md
# Products: drop a file in _products/ (any name).md
collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/
  products:
    output: true
    permalink: /products/:name/

# Blog posts: drop a file in _posts/ named YYYY-MM-DD-slug.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study
  - scope:
      path: ""
      type: products
    values:
      layout: product

exclude:
  - README.md
  - .gitignore
